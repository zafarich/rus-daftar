<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rus daftari</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sheet:#FFFFFF; --ink:#1C3D8F; --ink-soft:#5470B3;
  --red:#C42B3A; --green:#24774A; --text:#23272E; --muted:#5D6672; --line:#D5DDE7;
  --track:#EEF2F7; --seen:#B8C7EA; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --font:"Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --sheet:#171D26; --ink:#93B4FF; --ink-soft:#7390D8;
    --red:#FF7C86; --green:#6FD39A; --text:#E5E9EF; --muted:#9AA4B2; --line:#2C3644;
    --track:#212934; --seen:#3A4C7C; --shadow:none; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--text);background:var(--sheet);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{display:flex;gap:1rem;align-items:center;justify-content:space-between;
  max-width:820px;min-height:3.25rem;margin:0 auto;padding:.75rem 1.25rem .25rem}
header h1{font-size:1.15rem;font-weight:600;margin:0;letter-spacing:-.01em}
header .back{background:none;border:0;padding:.25rem 0;color:var(--ink);font-weight:500}
.sheet{max-width:820px;margin:0 auto 3rem;background:var(--sheet);min-height:70vh;padding:.5rem 1.25rem 2.5rem}
.title{font-size:1.5rem;font-weight:600;line-height:1.25;margin:.25rem 0 1rem;max-width:34ch}

/* Bosh sahifa: mavzular */
.hello{font-size:1.6rem;font-weight:600;line-height:1.2;margin:.25rem 0 .3rem;letter-spacing:-.01em}
.topics{display:grid;gap:.75rem;margin-top:1.25rem}
.topic{display:block;color:inherit;text-decoration:none;background:var(--sheet);border:1px solid var(--line);
  border-radius:14px;padding:1rem 1.1rem 1.05rem;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.topic:hover{border-color:var(--ink-soft)}
.topic:active{transform:scale(.99)}
.topic:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.topic .meta{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
.badge{background:var(--ink);color:var(--sheet);border-radius:999px;padding:.05rem .55rem;font-weight:500;font-size:.75rem}
.topic h3{font-size:1.1rem;font-weight:600;line-height:1.3;margin:0 0 .85rem}
.prog{display:flex;align-items:center;gap:.8rem}
.track{flex:1;display:flex;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%}
.track .l{background:var(--ink)}
.track .s{background:var(--seen)}
.pct{font-size:1.4rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.2ch;text-align:right}
.topic .foot{font-size:.8rem;color:var(--muted);margin-top:.5rem}
.key{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;margin-right:.35rem}
.key.l{background:var(--ink)}
.key.s{background:var(--seen)}
.legend{display:flex;flex-wrap:wrap;gap:.2rem .9rem;margin:0}
.legend > span{white-space:nowrap}

/* Mavzu ichidagi tablar */
nav.tabs{position:sticky;top:6px;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;
  padding:4px;margin:0 0 1.5rem;background:var(--track);border-radius:14px;box-shadow:0 0 0 6px var(--sheet)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;border:0;border-radius:10px;
  background:none;color:var(--muted);padding:.5rem .2rem .45rem;font-size:.78rem;font-weight:500;line-height:1.1}
nav.tabs button svg{width:22px;height:22px;flex:none}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected=true]{background:var(--ink);color:var(--sheet);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:.5rem .9rem}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.btn.good{border-color:var(--green);color:var(--green)}
.btn.bad{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:.2rem .75rem;font-size:.875rem;color:var(--muted)}
.chip[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
/* Qoida: sarlavha, misol, jadval, chizma, qolip */
.rule h3{font-size:1.15rem;font-weight:600;line-height:1.3;margin:2rem 0 .5rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.rule h3:first-child{margin-top:.25rem;padding-top:0;border-top:0}
.rule p,.rule ul{margin:.45rem 0;max-width:62ch}
.rule ul{padding-left:1.2rem}
.rule li{margin:.2rem 0}
.rule strong{color:var(--ink);font-weight:600}
.trap{border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:.5rem .75rem;margin:.7rem 0!important;
  background:color-mix(in srgb,var(--red) 7%,transparent)}
.egs{display:grid;gap:.35rem;margin:.65rem 0;max-width:34rem}
.eg{display:flex;gap:.6rem;align-items:flex-start;width:100%;text-align:left;background:var(--track);border:0;
  border-radius:10px;padding:.55rem .75rem;line-height:1.35}
button.eg:hover{box-shadow:inset 0 0 0 1px var(--ink-soft)}
.eg svg{width:18px;height:18px;flex:none;margin-top:.15rem;color:var(--ink-soft)}
.eg .ru{display:block;font-weight:500}
.eg .uz{display:block;color:var(--muted);font-size:.9rem}
.tbl{overflow-x:auto;margin:.75rem 0;max-width:38rem}
.tbl table{border-collapse:collapse;width:100%;font-size:.95rem;line-height:1.35}
.tbl th{font-size:.78rem;font-weight:500;color:var(--muted);text-align:left;padding:.3rem .7rem .35rem 0;border-bottom:1px solid var(--line)}
.tbl td{padding:.45rem .7rem .45rem 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.75rem 0;max-width:34rem}
.pics[data-n="2"],.pics[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.pics[data-n="1"]{grid-template-columns:minmax(0,12rem)}
.pic{border:1px solid var(--line);border-radius:12px;padding:.55rem .35rem .65rem;text-align:center;min-width:0}
.pic svg{width:80px;height:55px;color:var(--ink);fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pic svg .f{fill:currentColor;stroke:none}
.pic svg .x{stroke:var(--red)}
.pic svg .bg{fill:var(--sheet)}
.pic svg .o{fill:currentColor;stroke:var(--sheet);stroke-width:3}
.pic svg .d{stroke-dasharray:4 4.5}
.pic .q{font-size:.72rem;color:var(--muted);line-height:1.25}
.pic .ru{font-weight:600;line-height:1.25;margin-top:.2rem;overflow-wrap:anywhere}
.pic .uz{font-size:.82rem;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.pat{display:flex;flex-wrap:wrap;gap:.35rem;margin:.75rem 0}
.slot{border:1px solid var(--line);border-radius:10px;padding:.4rem .7rem .45rem;text-align:center}
.slot .m{font-weight:600;font-size:1.05rem;line-height:1.3}
.slot .c{font-size:.75rem;color:var(--muted);line-height:1.25}
.prompt{font-size:1.6rem;line-height:1.35;margin:1rem 0 1.25rem;font-weight:500}
.prompt.flawed{color:var(--red)}
.blank{display:inline-block;min-width:3.2ch;border-bottom:2px solid var(--ink-soft);margin:0 .15em}
.ink{font-family:var(--hand);color:var(--ink);font-size:2.1rem;line-height:1.15;font-weight:700}
.wrong{font-family:var(--hand);color:var(--red);font-size:1.8rem;text-decoration:line-through;text-decoration-thickness:2px}
.mark-ok{color:var(--green);font-family:var(--hand);font-size:2rem;font-weight:700}
.note{border-left:2px solid var(--red);padding-left:.6rem;margin:.6rem 0;color:var(--muted);max-width:56ch}
input.answer{font:inherit;font-size:1.25rem;width:100%;max-width:28rem;padding:.55rem .7rem;
  background:var(--sheet);color:var(--text);border:1px solid var(--line);border-radius:6px}
.counter{font-variant-numeric:tabular-nums}
.card{min-height:13rem;padding:1.5rem 0;cursor:pointer;user-select:none}
.bar{height:4px;background:var(--line);max-width:28rem;margin:.5rem 0 1rem;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ink);width:100%;transform-origin:left}
.bar.run > i{animation:shrink var(--dur,2.5s) linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.days{list-style:none;padding:0;margin:0}
.days li{padding:.8rem 0 .9rem;border-bottom:1px dashed var(--line)}
.days li.today{border-left:3px solid var(--ink);padding-left:.8rem;margin-left:-.95rem}
.days h4{margin:0 0 .25rem;font-size:1rem;font-weight:600}
.days ul{margin:.25rem 0 .5rem;padding-left:1.2rem;max-width:60ch}
.status-done{color:var(--green)} .status-missed{color:var(--red)}
.empty{padding:2rem 0;max-width:40ch}
@media (max-width:560px){ header{padding:.6rem 1rem .25rem} .sheet{padding:.5rem 1rem 2rem} .prompt{font-size:1.35rem} }
@media (prefers-reduced-motion:reduce){ .bar.run > i{animation-duration:.01s} }
</style>
</head>
<body>
<header id="hdr"><h1>Rus daftari</h1></header>
<main class="sheet" id="sheet"><p class="muted">Yuklanmoqda…</p></main>

<script>
"use strict";
let keys = null;
const $sheet = document.getElementById("sheet");
const $hdr = document.getElementById("hdr");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// Telegram Mini App: ichida ochilganda initData imzosi bilan kiramiz
const TG = window.Telegram && window.Telegram.WebApp;
const INIT = (TG && TG.initData) || "";
if (INIT) {
  TG.ready(); TG.expand();
  try {
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--sheet").trim();
    if (TG.isVersionAtLeast("6.1")) { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); }
    if (TG.isVersionAtLeast("7.7")) TG.disableVerticalSwipes(); // kartochkada pastga surganda yopilmasin
    if (TG.isVersionAtLeast("6.1")) TG.BackButton.onClick(() => go(""));
  } catch {}
}
const S = { view: "home", topics: [], topicsStale: false, topic: null, tab: "rule", ex: null, cards: null, drill: null };

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
  return n;
}
// DOM append(null) "null" matnini chiqaradi, shuning uchun bo'shlarini tashlab yuboramiz
const add = (parent, ...kids) => parent.append(...kids.filter(k => k != null && k !== false));
async function api(path, body) {
  const headers = {};
  if (INIT) headers["X-Telegram-Init-Data"] = INIT;
  if (body) headers["Content-Type"] = "application/json";
  const r = await fetch(path, body ? { method: "POST", headers, body: JSON.stringify(body) } : { headers });
  if (r.status === 401) { showLocked(); throw new Error("auth"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fill = (p, a) => p.replace("___", a);
const fullOf = it => it.prompt.includes("___") ? fill(it.prompt, it.answers[0]) : it.answers[0];

// Mikrofon yopilganda qurilma audio rejimini almashtiradi (Bluetooth quloqchin, Android, iOS).
// Shu payt boshlangan o'qish o'rtasida uziladi, shuning uchun mikrofon to'liq yopilib,
// MIC_SETTLE_MS o'tgandan keyingina gapiramiz.
const MIC_SETTLE_MS = 800;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const mic = { busy: null, endedAt: 0 };
let speakSeq = 0;
let curUtt = null; // Chrome o'qilayotgan utterance'ni xotiradan tozalab, ovozni uzmasligi uchun

function listen(onText) {
  if ("speechSynthesis" in window) speechSynthesis.cancel(); // mikrofon o'z ovozimizni eshitmasin
  const r = new SR(); r.lang = "ru-RU"; r.interimResults = false; r.maxAlternatives = 1;
  let done;
  mic.busy = new Promise(res => { done = () => { mic.endedAt = Date.now(); mic.busy = null; res(); }; });
  r.onresult = ev => { onText(ev.results[0][0].transcript); r.stop(); };
  r.onend = done;
  try { r.start(); } catch { done(); }
}

async function speak(text) {
  if (!("speechSynthesis" in window)) return;
  const seq = ++speakSeq;
  if (mic.busy) await Promise.race([mic.busy, sleep(8000)]);
  const wait = mic.endedAt + MIC_SETTLE_MS - Date.now();
  if (wait > 0) await sleep(wait);
  if (seq !== speakSeq) return; // kutish paytida boshqa matn o'qishga berildi
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ru-RU"; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("ru"));
  if (v) u.voice = v;
  u.onend = u.onerror = () => { if (curUtt === u) curUtt = null; };
  curUtt = u;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const speakBtn = text => ("speechSynthesis" in window) ? el("button", { class: "btn", type: "button", "aria-label": "Eshitish", onclick: () => speak(text) }, "🔊 Eshitish") : null;

function promptNode(text) {
  const n = el("div", { class: "prompt" });
  text.split("___").forEach((part, i) => { if (i) n.append(el("span", { class: "blank", "aria-label": "bo'sh joy" }, " ")); n.append(part); });
  return n;
}
function inline(text) { // **qalin** ni xavfsiz ko'rsatish
  const frag = document.createDocumentFragment();
  text.split(/(\*\*[^*]+\*\*)/g).forEach(p => frag.append(p.startsWith("**") && p.endsWith("**") ? el("strong", {}, p.slice(2, -2)) : p));
  return frag;
}

// ---------- yuklash ----------
function showLocked() {
  $hdr.replaceChildren(el("h1", {}, "Rus daftari"));
  $sheet.replaceChildren(el("div", { class: "empty" },
    el("h2", { class: "title" }, "Daftarga kirish"),
    INIT ? el("p", {}, "Sessiya eskirgan. Daftarni yopib, botdan qayta oching.")
         : el("p", {}, "Daftar Telegram bot orqali ochiladi. Botga ", el("b", {}, "/daftar"),
                 " yuboring va «Daftarni ochish» yoki «Brauzerda ochish» tugmasini bosing.")));
}

async function boot() {
  // Telegram ma'lumoti URL'ning # qismida keladi; SDK uni o'qib bo'lgan, manzilni tozalaymiz
  if (/^#?tgWebApp/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
  S.me = await api("/api/me");
  S.topics = await api("/api/topics");
  await route();
}

// ---------- yo'nalish: "#" — mavzular, "#slug" — mavzu ichi ----------
const onFail = err => { if (err.message !== "auth") $sheet.replaceChildren(el("p", {}, "Yuklab bo'lmadi: " + err.message)); };
const routeSlug = () => decodeURIComponent(location.hash.slice(1));
function go(slug) {
  if (routeSlug() === slug) route().catch(onFail);
  else location.hash = slug ? encodeURIComponent(slug) : "";
}
async function route() {
  const slug = routeSlug();
  if (slug && S.topics.some(t => t.slug === slug)) await openTopic(slug);
  else await showHome();
}
window.addEventListener("hashchange", () => route().catch(onFail));

function renderHeader() {
  const inTopic = S.view === "topic";
  // Telegram ichida orqaga qaytish uchun Telegram'ning o'z tugmasi bor
  const left = inTopic && !INIT
    ? el("button", { class: "back", type: "button", onclick: () => go("") }, "‹ Mavzular")
    : el("h1", {}, "Rus daftari");
  // Telegram ichida ovoz bilan ishlash har doim ham ishlamaydi: brauzerda ochish imkoniyati
  const right = INIT && S.me && S.me.browser_url
    ? el("button", { class: "chip", type: "button", onclick: () => TG.openLink(S.me.browser_url) }, "🌐 Brauzerda")
    : null;
  $hdr.replaceChildren();
  add($hdr, left, right);
  if (INIT && TG.isVersionAtLeast("6.1")) inTopic ? TG.BackButton.show() : TG.BackButton.hide();
}

// ---------- Bosh sahifa ----------
async function showHome() {
  if (S.drill) clearTimeout(S.drill.timer);
  if (S.topicsStale) { S.topics = await api("/api/topics"); S.topicsStale = false; }
  S.view = "home"; S.topic = null; keys = null;
  renderHeader();
  if (!S.topics.length) {
    $sheet.replaceChildren(el("div", { class: "empty" }, el("p", {}, "Hali mavzu yo'q."),
      el("p", { class: "muted" }, "Serverda: python manage.py import topics/01_predlozhny.json --activate")));
    return;
  }
  const name = S.me && S.me.first_name;
  $sheet.replaceChildren(
    el("h2", { class: "hello" }, name ? `Salom, ${name}!` : "Mavzular"),
    el("p", { class: "legend muted small" },
      el("span", {}, el("span", { class: "key l" }), "o'zlashtirildi (3 marta ketma-ket to'g'ri)"),
      el("span", {}, el("span", { class: "key s" }), "jarayonda")),
    el("div", { class: "topics" }, S.topics.map(topicCard)));
  window.scrollTo(0, 0);
}

function topicCard(t) {
  const n = t.n_items || 0, learned = t.learned || 0, seen = Math.max(t.seen || 0, learned);
  const pct = n ? Math.round(100 * learned / n) : 0;
  const w = x => `width:${n ? (100 * x / n).toFixed(2) : 0}%`;
  const meta = [];
  if (t.active) meta.push(el("span", { class: "badge" }, "Faol"));
  if (t.today && t.plan_days) meta.push(el("span", {}, t.today <= t.plan_days ? `Reja: ${t.today}-kun / ${t.plan_days}` : "Reja tugadi"));
  return el("a", { class: "topic", href: "#" + encodeURIComponent(t.slug) },
    meta.length ? el("div", { class: "meta" }, meta) : null,
    el("h3", {}, t.title),
    el("div", { class: "prog" },
      el("div", { class: "track", role: "progressbar", "aria-label": "O'zlashtirildi",
                  "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(pct) },
        el("i", { class: "l", style: w(learned) }), el("i", { class: "s", style: w(seen - learned) })),
      el("span", { class: "pct" }, pct + "%")),
    el("div", { class: "foot" }, `${learned} o'zlashtirildi · ${seen - learned} jarayonda · ${n} savol`));
}

// ---------- Mavzu ichi ----------
async function openTopic(slug) {
  S.topic = await api("/api/topics/" + encodeURIComponent(slug));
  S.view = "topic"; S.topicsStale = true;
  S.ex = S.cards = S.drill = null;
  renderHeader(); render(); window.scrollTo(0, 0);
}

const ICONS = {
  rule: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  cards: '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h11"/>',
  ex: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  drill: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  plan: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
  sound: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
};
function icon(name) { // faqat yuqoridagi o'zgarmas ikonkalar
  const t = document.createElement("template");
  t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
  return t.content.firstChild;
}

const TABS = [["rule", "Qoida"], ["cards", "Kartalar"], ["ex", "Mashq"], ["drill", "Ramka"], ["plan", "Reja"]];
function render() {
  const t = S.topic;
  keys = null;
  if (S.tab !== "drill" && S.drill) clearTimeout(S.drill.timer);
  const nav = el("nav", { class: "tabs", role: "tablist", "aria-label": "Bo'limlar" }, TABS.map(([k, label]) =>
    el("button", { role: "tab", type: "button", "aria-selected": String(S.tab === k),
      onclick: () => { S.tab = k; render(); if (window.scrollY > 0) window.scrollTo(0, 0); } },
      icon(k), el("span", {}, label))));
  const body = el("section", { role: "tabpanel" });
  ({ rule: renderRule, cards: renderCards, ex: renderEx, drill: renderDrill, plan: renderPlan })[S.tab](body);
  $sheet.replaceChildren(el("h2", { class: "title" }, t.title), nav, body);
}

// ---------- Qoida ----------
// Qoida matni satrma-satr o'qiladi:
//   "## "  sarlavha            "- "  ro'yxat               "! "  tuzoq (qizil chiziqli eslatma)
//   "> ruscha — o'zbekcha"     misol, bosilsa ovoz chiqarib o'qiydi
//   "| a | b |"                jadval, birinchi satr sarlavha
//   "@ belgi | savol | ruscha | o'zbekcha"   chizma (belgi: PICS kalitlaridan biri)
//   "= bo'lak :: izoh | bo'lak :: izoh"      gap qolipi
// Chizmalar: quti — joy, nuqta — siz, odam shakli — boshqa kishi, strelka — harakat. Faqat shu o'zgarmas rasmlar chiziladi.
const PICS = {
  in: '<rect x="18" y="8" width="28" height="28" rx="5"/><circle class="f" cx="32" cy="22" r="5"/>',
  to: '<rect x="30" y="8" width="28" height="28" rx="5"/><path d="M4 22h36"/><path d="m34 16 6 6-6 6"/>',
  from: '<rect x="6" y="8" width="28" height="28" rx="5"/><path d="M24 22h36"/><path d="m54 16 6 6-6 6"/>',
  on: '<path d="M12 35h40"/><circle class="f" cx="32" cy="27" r="5"/>',
  onto: '<path d="M22 35h36"/><path d="M6 8 36 27"/><path d="M32.3 19.9 36 27l-8-.3"/>',
  off: '<path d="M6 35h36"/><path d="M28 27 58 8"/><path d="m50 8.3 8-.3-3.7 7.1"/>',
  at: '<rect x="28" y="8" width="28" height="28" rx="5"/><circle class="f" cx="13" cy="22" r="5"/>',
  away: '<circle cx="14" cy="15" r="5"/><path d="M5 35a9 9 0 0 1 18 0"/><path d="M30 22h28"/><path d="m52 16 6 6-6 6"/>',
  none: '<rect class="d" x="18" y="8" width="28" height="28" rx="5"/><path class="x" d="m27 17 10 10M37 17 27 27"/>',
  toward: '<path d="M6 22h28"/><path d="m28 16 6 6-6 6"/><circle cx="50" cy="15" r="5"/><path d="M41 35a9 9 0 0 1 18 0"/>',
  beside: '<circle class="f" cx="15" cy="25" r="5"/><circle cx="42" cy="15" r="5"/><path d="M33 35a9 9 0 0 1 18 0"/>',
  give: '<rect class="f" x="4" y="17" width="10" height="10" rx="2"/><path d="M19 22h17"/><path d="m30 16 6 6-6 6"/><circle cx="50" cy="15" r="5"/><path d="M41 35a9 9 0 0 1 18 0"/>',
  along: '<path d="M6 11h52M6 33h52"/><path d="M15 22h32"/><path d="m41 16 6 6-6 6"/>',
  with: '<circle cx="21" cy="15" r="5"/><path d="M12 35a9 9 0 0 1 18 0"/><circle cx="43" cy="15" r="5"/><path d="M34 35a9 9 0 0 1 18 0"/>',
  above: '<rect x="18" y="20" width="28" height="20" rx="5"/><circle class="f" cx="32" cy="9" r="5"/>',
  under: '<rect x="18" y="4" width="28" height="20" rx="5"/><circle class="f" cx="32" cy="35" r="5"/>',
  front: '<rect x="24" y="5" width="28" height="28" rx="5"/><circle class="o" cx="24" cy="31" r="6"/>',
  behind: '<circle class="f" cx="35" cy="12" r="6"/><rect class="bg" x="13" y="12" width="28" height="28" rx="5"/>',
  between: '<rect x="4" y="10" width="16" height="24" rx="4"/><rect x="44" y="10" width="16" height="24" rx="4"/><circle class="f" cx="32" cy="22" r="5"/>',
  one: '<circle class="f" cx="32" cy="22" r="5"/>',
  few: '<circle class="f" cx="16" cy="22" r="5"/><circle class="f" cx="32" cy="22" r="5"/><circle class="f" cx="48" cy="22" r="5"/>',
  many: '<circle class="f" cx="11" cy="12" r="4.5"/><circle class="f" cx="25" cy="12" r="4.5"/><circle class="f" cx="39" cy="12" r="4.5"/><circle class="f" cx="53" cy="12" r="4.5"/><circle class="f" cx="11" cy="32" r="4.5"/><circle class="f" cx="25" cy="32" r="4.5"/><circle class="f" cx="39" cy="32" r="4.5"/><circle class="f" cx="53" cy="32" r="4.5"/>',
};
function pic(name) {
  const t = document.createElement("template");
  t.innerHTML = `<svg viewBox="0 0 64 44" aria-hidden="true">${PICS[name] || ""}</svg>`;
  return t.content.firstChild;
}
const cells = line => line.replace(/^\|/, "").replace(/\|$/, "").split("|").map(x => x.trim());
const plain = text => text.replace(/\*\*/g, "");

function ruleExample(body) {
  const i = body.indexOf(" — ");
  const ru = i < 0 ? body : body.slice(0, i), uz = i < 0 ? "" : body.slice(i + 3);
  const text = el("span", {}, el("span", { class: "ru", lang: "ru" }, inline(ru)), uz ? el("span", { class: "uz" }, inline(uz)) : null);
  return ("speechSynthesis" in window)
    ? el("button", { class: "eg", type: "button", title: "Eshitish", onclick: () => speak(plain(ru)) }, icon("sound"), text)
    : el("div", { class: "eg" }, text);
}
function rulePic(body) {
  const [name, q, ru, uz] = cells(body);
  return el("div", { class: "pic" }, pic(name), q ? el("div", { class: "q" }, q) : null,
    ru ? el("div", { class: "ru", lang: "ru" }, inline(ru)) : null, uz ? el("div", { class: "uz" }, inline(uz)) : null);
}
function rulePattern(body) {
  return el("div", { class: "pat" }, cells(body).map(c => {
    const [main, cap] = c.split("::").map(x => x.trim());
    return el("div", { class: "slot" }, el("div", { class: "m" }, inline(main)), cap ? el("div", { class: "c" }, inline(cap)) : null);
  }));
}
function renderRule(box) {
  const wrap = el("div", { class: "rule" });
  let kind = "", group = null; // ketma-ket kelgan bir xil satrlar bitta blokka yig'iladi
  const into = (k, make) => { if (kind !== k) { kind = k; group = make(); wrap.append(group); } return group; };
  const single = node => { kind = ""; wrap.append(node); };
  for (const raw of (S.topic.summary || "").split("\n")) {
    const line = raw.trim(), body = line.slice(2).trim();
    if (!line) kind = "";
    else if (line.startsWith("## ")) single(el("h3", {}, line.slice(3)));
    else if (line.startsWith("- ")) into("ul", () => el("ul")).append(el("li", {}, inline(body)));
    else if (line.startsWith("> ")) into("eg", () => el("div", { class: "egs" })).append(ruleExample(body));
    else if (line.startsWith("@ ")) { const g = into("pic", () => el("div", { class: "pics" })); g.append(rulePic(body)); g.dataset.n = g.children.length; }
    else if (line.startsWith("= ")) single(rulePattern(body));
    else if (line.startsWith("! ")) single(el("p", { class: "trap" }, inline(body)));
    else if (line.startsWith("|")) {
      const row = cells(line);
      if (row.every(c => /^:?-+:?$/.test(c))) continue; // markdown ajratkich satri
      const table = into("tbl", () => el("div", { class: "tbl" }, el("table"))).firstChild;
      table.append(el("tr", {}, row.map(c => el(table.rows.length ? "td" : "th", {}, inline(c)))));
    }
    else single(el("p", {}, inline(line)));
  }
  box.append(wrap);
}

// ---------- Kartochkalar ----------
function renderCards(box) {
  const all = S.topic.items.filter(i => i.kind === "card");
  if (!all.length) { box.append(el("p", { class: "muted" }, "Bu mavzuda kartochka yo'q.")); return; }
  if (!S.cards) S.cards = { deck: shuffle(all), i: 0, flipped: false, ok: 0, missed: [] };
  const c = S.cards;
  if (c.i >= c.deck.length) {
    box.append(el("p", {}, `Hammasi aylantirildi. Bildingiz: ${c.ok}/${c.deck.length}.`),
      el("div", { class: "row" },
        c.missed.length ? el("button", { class: "btn primary", onclick: () => { S.cards = { deck: shuffle(c.missed), i: 0, flipped: false, ok: 0, missed: [] }; render(); } }, `Bilmaganlarimni qayta (${c.missed.length})`) : null,
        el("button", { class: "btn", onclick: () => { S.cards = null; render(); } }, "Hammasini qaytadan")));
    return;
  }
  const it = c.deck[c.i];
  const flip = () => { c.flipped = true; render(); speak(it.answers[0]); };
  const grade = async ok => { if (ok) c.ok++; else c.missed.push(it); c.i++; c.flipped = false; render(); api("/api/review", { item_id: it.id, correct: ok }).catch(() => {}); };
  box.append(el("p", { class: "muted small counter" }, `${c.i + 1} / ${c.deck.length}`),
    el("div", { class: "card", tabindex: "0", role: "button", "aria-label": "Ag'darish", onclick: () => !c.flipped && flip() },
      el("div", { class: "prompt" }, it.prompt),
      c.flipped ? el("div", { class: "ink" }, it.answers[0]) : el("div", { class: "muted small" }, "Ruschasini ovoz chiqarib ayting, keyin ag'daring (bo'sh joy tugmasi)."),
      c.flipped && it.note ? el("div", { class: "note" }, it.note) : null),
    c.flipped
      ? el("div", { class: "row" }, el("button", { class: "btn bad", onclick: () => grade(false) }, "Bilmadim (1)"),
          el("button", { class: "btn good", onclick: () => grade(true) }, "Bildim (2)"), speakBtn(it.answers[0]))
      : el("button", { class: "btn primary", onclick: flip }, "Ag'darish"));
  keys = e => { if (e.target.tagName === "INPUT") return; if (e.code === "Space") { e.preventDefault(); if (!c.flipped) flip(); } else if (c.flipped && e.key === "1") grade(false); else if (c.flipped && e.key === "2") grade(true); };
}

// ---------- Mashq ----------
const EX_KINDS = [["all", "Hammasi"], ["weak", "Xatolarim"], ["gap", "Bo'sh joy"], ["ending", "Qo'shimcha"], ["choice", "Tanlash"], ["fix", "Xatoni topish"], ["translate", "Tarjima"], ["sentence", "To'liq gap"]];
const EX_LABEL = { gap: "Bo'sh joyni to'ldiring", ending: "Qo'shimchani yozing", choice: "To'g'ri variantni tanlang", fix: "Gapda xato bor, to'g'rilab yozing", translate: "Ruschaga tarjima qiling", sentence: "To'liq gap yozing" };
const EX_ALL = ["gap", "ending", "choice", "fix", "translate", "sentence"];
// box === 0: oxirgi javob xato bo'lgan savol (botda yoki daftarda)
const weakItems = () => S.topic.items.filter(i => EX_ALL.includes(i.kind) && i.box === 0);
function newEx(filter) {
  const pool = filter === "weak" ? weakItems() : S.topic.items.filter(i => (filter === "all" ? EX_ALL : [filter]).includes(i.kind));
  S.ex = { filter, queue: shuffle(pool), i: 0, ok: 0, res: null, given: "", wrong: [] };
}
function renderEx(box) {
  if (!S.ex) newEx("all");
  const e = S.ex;
  const nWeak = weakItems().length;
  box.append(el("div", { class: "row", style: "margin-bottom:1rem" }, EX_KINDS.map(([k, label]) =>
    el("button", { class: "chip", "aria-pressed": String(e.filter === k), onclick: () => { newEx(k); render(); } },
      k === "weak" && nWeak ? `${label} (${nWeak})` : label))));
  if (!e.queue.length) { box.append(el("p", { class: "muted" }, e.filter === "weak" ? "Xato qilingan savol qolmadi." : "Bu turda mashq yo'q.")); return; }
  if (e.i >= e.queue.length) {
    box.append(el("p", {}, `Tugadi: ${e.ok}/${e.queue.length} to'g'ri.`),
      el("div", { class: "row" },
        e.wrong.length ? el("button", { class: "btn primary", onclick: () => { S.ex = { ...e, queue: shuffle(e.wrong), i: 0, ok: 0, res: null, wrong: [] }; render(); } }, `Xatolarni qayta (${e.wrong.length})`) : null,
        el("button", { class: "btn", onclick: () => { newEx(e.filter); render(); } }, "Qaytadan")));
    return;
  }
  const it = e.queue[e.i];
  const prompt = promptNode(it.prompt);
  if (it.kind === "fix") prompt.classList.add("flawed");
  box.append(el("p", { class: "muted small counter" }, `${e.i + 1} / ${e.queue.length} · ${EX_LABEL[it.kind]}`), prompt);

  const submit = async answer => {
    if (e.res) return;
    e.given = answer;
    e.res = { pending: true }; render();
    try { e.res = await api("/api/check", { item_id: it.id, answer }); }
    catch (err) { e.res = null; alert("Xato: " + err.message); render(); return; }
    if (e.res.correct) e.ok++; else e.wrong.push(it);
    it.box = e.res.correct ? (it.box || 0) + 1 : 0;
    render(); speak(e.res.full);
  };
  const next = () => { e.i++; e.res = null; e.given = ""; render(); };

  if (!e.res) {
    if (it.kind === "choice") {
      box.append(el("div", { class: "row" }, it.options.map((o, n) => el("button", { class: "btn", onclick: () => submit(o) }, `${o} (${n + 1})`))));
      keys = ev => { const n = Number(ev.key) - 1; if (it.options[n] != null) submit(it.options[n]); };
    } else {
      const inp = el("input", { class: "answer", lang: "ru", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Javob", placeholder: it.kind === "ending" ? "qo'shimcha yoki butun so'z" : "javob" });
      if (it.kind === "fix") inp.value = it.prompt; // xato gap tayyor turadi, faqat xato so'z tuzatiladi
      inp.addEventListener("keydown", ev => { if (ev.key === "Enter" && inp.value.trim()) submit(inp.value); });
      const micBtn = SR ? el("button", { class: "btn", type: "button", onclick: () =>
        listen(text => { inp.value = text; inp.focus(); }) }, "🎤 Aytish") : null;
      box.append(el("div", { class: "row" }, inp),
        el("div", { class: "row", style: "margin-top:.75rem" },
          el("button", { class: "btn primary", onclick: () => inp.value.trim() && submit(inp.value) }, "Tekshirish"), micBtn,
          el("button", { class: "btn", onclick: () => submit("") }, "Bilmayman")));
      if (it.hint) box.append(el("p", { class: "muted small" }, "Yordam: " + it.hint));
      setTimeout(() => inp.focus(), 0);
      keys = null;
    }
    return;
  }
  if (e.res.pending) { box.append(el("p", { class: "muted" }, "Tekshirilmoqda…")); return; }
  const r = e.res;
  if (r.correct) box.append(el("div", { class: "row" }, el("span", { class: "mark-ok", "aria-label": "To'g'ri" }, "✓"), el("span", { class: "ink" }, r.full)));
  else add(box, el("div", {}, e.given ? el("div", { class: "wrong" }, e.given) : null, el("div", { class: "ink" }, r.full)),
    it.note ? el("div", { class: "note" }, it.note) : null);
  if (r.comment) box.append(el("div", { class: "note" }, r.comment));
  box.append(el("div", { class: "row", style: "margin-top:1rem" }, el("button", { class: "btn primary", onclick: next }, "Keyingisi (Enter)"), speakBtn(r.full)));
  keys = ev => { if (ev.key === "Enter") next(); };
}

// ---------- Ramka (tezkor) ----------
function renderDrill(box) {
  const items = S.topic.items.filter(i => i.kind === "drill");
  if (!items.length) { box.append(el("p", { class: "muted" }, "Bu mavzuda ramka mashqi yo'q.")); return; }
  const frames = [...new Map(items.map(i => [i.prompt, i.extra.title || i.prompt])).entries()];
  if (!S.drill) {
    box.append(el("p", { class: "muted", style: "max-width:58ch" }, "Ramka bir xil qoladi, faqat so'z almashadi. So'zni ko'rgan zahoti butun gapni ovoz chiqarib ayting. 2,5 soniyadan keyin javob ochiladi."),
      el("div", { class: "row" }, frames.map(([p, title]) => el("button", { class: "btn", onclick: () => {
        S.drill = { frame: p, queue: shuffle(items.filter(i => i.prompt === p)), i: 0, ok: 0, shown: false }; render();
      } }, title))));
    return;
  }
  const d = S.drill;
  if (d.i >= d.queue.length) {
    box.append(el("p", {}, `Aylana tugadi: ${d.ok}/${d.queue.length} ulgurdingiz.`),
      el("div", { class: "row" }, el("button", { class: "btn primary", onclick: () => { S.drill = { ...d, queue: shuffle(d.queue), i: 0, ok: 0, shown: false }; render(); } }, "Yana bir aylana"),
        el("button", { class: "btn", onclick: () => { S.drill = null; render(); } }, "Boshqa ramka")));
    return;
  }
  const it = d.queue[d.i];
  const full = fill(it.prompt, it.answers[0]);
  const show = () => { if (d.shown) return; d.shown = true; clearTimeout(d.timer); render(); speak(full); };
  const grade = ok => { if (ok) d.ok++; d.i++; d.shown = false; render(); api("/api/review", { item_id: it.id, correct: ok }).catch(() => {}); };
  box.append(el("p", { class: "muted small counter" }, `${d.i + 1} / ${d.queue.length}`), promptNode(it.prompt),
    el("p", { style: "font-size:1.25rem;margin:0" }, `${it.extra.uz || ""} → `, el("strong", {}, it.extra.base || "")));
  if (!d.shown) {
    const bar = el("div", { class: "bar" }, el("i"));
    box.append(bar, el("button", { class: "btn", onclick: show }, "Javobni ko'rsatish (bo'sh joy)"));
    requestAnimationFrame(() => bar.classList.add("run"));
    clearTimeout(d.timer); d.timer = setTimeout(show, 2500);
    keys = ev => { if (ev.code === "Space") { ev.preventDefault(); show(); } };
  } else {
    add(box, el("div", { class: "ink", style: "margin:1rem 0 .5rem" }, full),
      it.note ? el("div", { class: "note" }, it.note) : null,
      el("div", { class: "row", style: "margin-top:.75rem" }, el("button", { class: "btn bad", onclick: () => grade(false) }, "Ulgurmadim (1)"),
        el("button", { class: "btn good", onclick: () => grade(true) }, "Ulgurdim (2)"), speakBtn(full)));
    keys = ev => { if (ev.key === "1") grade(false); else if (ev.key === "2") grade(true); };
  }
}

// ---------- 7 kun ----------
function renderPlan(box) {
  const t = S.topic;
  if (!t.plan.length) { box.append(el("p", { class: "muted" }, "Bu mavzuda reja yo'q.")); return; }
  if (!t.started_on || !t.active) {
    box.append(el("p", { style: "max-width:52ch" }, t.started_on ? "Bu mavzu hozir faol emas. Faol qilsangiz, bot shu mavzu bo'yicha so'raydi." : "Reja boshlanganda bot har kuni ertalab vazifani yuboradi, kechqurun bajarildimi deb so'raydi."),
      el("button", { class: "btn primary", onclick: async () => { await api(`/api/topics/${t.slug}/activate`, { restart: false }); S.tab = "plan"; await openTopic(t.slug); } }, t.started_on ? "Faol qilish" : "Bugundan boshlash"));
    if (!t.started_on) return;
  }
  const list = el("ol", { class: "days" });
  t.plan.forEach((day, idx) => {
    const n = idx + 1, st = t.log[n], isToday = n === t.today;
    const mark = st === "done" ? el("span", { class: "status-done" }, " ✓ bajarildi") : st === "missed" ? el("span", { class: "status-missed" }, " ✗ bajarilmadi") : null;
    const set = async status => { t.log = await api("/api/plan", { slug: t.slug, day: n, status }); render(); };
    list.append(el("li", { class: isToday ? "today" : "" },
      el("h4", {}, `${n}-kun`, isToday ? el("span", { class: "muted" }, " · bugun") : null, mark),
      el("ul", {}, day.tasks.map(x => el("li", {}, x))),
      t.today && n <= t.today ? el("div", { class: "row" },
        el("button", { class: "btn good", "aria-pressed": String(st === "done"), onclick: () => set("done") }, "Bajarildi"),
        el("button", { class: "btn bad", "aria-pressed": String(st === "missed"), onclick: () => set("missed") }, "Bajarilmadi")) : null));
  });
  box.append(list, el("p", { class: "small", style: "margin-top:1.5rem" },
    el("button", { class: "chip", onclick: async () => { if (!confirm("7 kunlik reja bugundan qaytadan boshlansinmi? Belgilar o'chadi.")) return; await api(`/api/topics/${t.slug}/activate`, { restart: true }); await openTopic(t.slug); } }, "Rejani qaytadan boshlash")));
}

document.addEventListener("keydown", ev => { if (keys && !ev.metaKey && !ev.ctrlKey && !ev.altKey) keys(ev); });
if ("speechSynthesis" in window) speechSynthesis.getVoices();
boot().catch(onFail);
</script>
